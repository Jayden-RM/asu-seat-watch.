name: Test ASU Email

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Send test to email alias me
        env:
          GAS_EMAIL_URL: ${{ secrets.GAS_EMAIL_URL }}
          GAS_SHARED_SECRET: ${{ secrets.GAS_SHARED_SECRET }}
        run: |
          node <<'NODE'
          (async () => {
            if (!process.env.GAS_EMAIL_URL || !process.env.GAS_SHARED_SECRET) throw new Error('Missing GitHub email secrets');
            const response = await fetch(process.env.GAS_EMAIL_URL, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                token: process.env.GAS_SHARED_SECRET,
                recipient: 'me',
                subject: 'TEST: ASU class watchlist',
                message: 'Your GitHub ASU email notification works.'
              })
            });
            const body = (await response.text()).trim();
            if (!response.ok || body !== 'OK') throw new Error('Email test failed: ' + response.status + ' ' + body);
            console.log('Test email accepted for alias me!');
          })().catch(e => { console.error(e); process.exitCode = 1; });
          NODE
