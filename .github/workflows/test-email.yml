
name: Test ASU Email

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Send test email
        env:
          GAS_EMAIL_URL: ${{ secrets.GAS_EMAIL_URL }}
          GAS_SHARED_SECRET: ${{ secrets.GAS_SHARED_SECRET }}
        run: |
          node <<'NODE'
          (async () => {
            const url = process.env.GAS_EMAIL_URL;
            const token = process.env.GAS_SHARED_SECRET;

            if (!url || !token) {
              throw new Error("Missing email secrets");
            }

            const response = await fetch(url, {
              method: "POST",
              headers: {
                "Content-Type": "application/json"
              },
              body: JSON.stringify({
                token,
                subject: "TEST: ASU EEE 202 Alert",
                message: "Your GitHub email alerts work!"
              })
            });

            const body = (await response.text()).trim();

            if (!response.ok || body !== "OK") {
              throw new Error("Email test failed");
            }

            console.log("Test email accepted!");
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE
