name: Monitor ASU seat watchlist

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: asu-seat-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.58.2-noble
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Check watched ASU classes and notify recipients
        env:
          GAS_EMAIL_URL: ${{ secrets.GAS_EMAIL_URL }}
          GAS_SHARED_SECRET: ${{ secrets.GAS_SHARED_SECRET }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: node asu_check_once.js
      - name: Persist seat state (including successful alerts)
        if: always()
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add state/asu_seat_state.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update ASU seat status [skip ci]'
            git push
          fi
